name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - name: The tag matches the version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: node tools/build.mjs --zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk "/^## ${GITHUB_REF_NAME#v}/{f=1;next} /^## /{f=0} f" CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/module.json dist/module.zip --title "Krynn for PF2e ${GITHUB_REF_NAME}" --notes "$notes"
